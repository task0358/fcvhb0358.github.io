<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>単語帳</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--ink:#16171d;--sub:#6b7080;--line:#e2e4ec;--ac:#6c5ce0;--ok:#1f9d63;--ng:#e5484d;--am:#e0a21a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1015;--card:#1a1b23;--ink:#eef0f6;--sub:#9aa0b4;--line:#2b2d38;--ac:#8f82f5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1015;--card:#1a1b23;--ink:#eef0f6;--sub:#9aa0b4;--line:#2b2d38;--ac:#8f82f5;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
header{max-width:560px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:20px;letter-spacing:.02em}
main{max-width:560px;margin:0 auto;padding:0 16px 96px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;max-width:140px;padding:13px 0;background:none;border:0;color:var(--sub);font:inherit;font-size:13px;cursor:pointer}
nav button.on{color:var(--ac);font-weight:700}
h2{font-size:20px;margin:4px 0 12px}h3{font-size:14px;color:var(--sub);margin:16px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px}
.pad{padding:16px;margin-bottom:14px}
.sw{height:min(54vh,430px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;touch-action:pan-y;user-select:none;cursor:grab;border-width:2px;margin:10px 0 14px}
.sw[data-d="r"]{border-color:var(--ok)}.sw[data-d="l"]{border-color:var(--ng)}
.word{font-size:clamp(34px,11vw,52px);font-weight:800;letter-spacing:-.02em;word-break:break-word;text-align:center;padding:0 10px;line-height:1.15}
.ja{font-size:22px;font-weight:700;color:var(--ac);text-align:center;padding:0 12px}
.sub{color:var(--sub);font-size:14px;margin:4px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.btn,.ico{padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.btn{flex:1}.ico{padding:8px 12px}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ok{color:var(--ok);border-color:var(--ok)}.btn.ng{color:var(--ng);border-color:var(--ng)}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.opt.ok{border-color:var(--ok)}.opt.ng{border-color:var(--ng)}
input,select,textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;margin:4px 0}
textarea{min-height:76px}
.top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}.k{background:var(--ok)}.l{background:var(--am)}.a{background:var(--ac)}
.wrow{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.wrow:last-child{border:0}.wrow span:nth-child(3){flex:1;color:var(--sub);font-size:14px}
.no{min-width:34px;color:var(--sub);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}.dot.known{background:var(--ok)}.dot.learning{background:var(--am)}
.pct{font-size:56px;font-weight:800;color:var(--ac);line-height:1}
.ex{margin:4px 0;padding-left:10px;border-left:3px solid var(--ac);white-space:pre-wrap}
.msg{color:var(--ng);font-size:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px}.mk{font-size:26px;line-height:1}.mk.ok{color:var(--ok)}.mk.ng{color:var(--ng)}
.pos{display:inline-block;padding:1px 9px;border-radius:999px;border:1px solid var(--ac);color:var(--ac);font-size:12px;font-weight:700;line-height:1.7;white-space:nowrap}.ri{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;padding:8px 0;border-bottom:1px solid var(--line)}.ri:last-child{border:0}.ri b{font-size:16px}.ri .ip{color:var(--sub);font-size:13px}#em:empty{display:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style></head><body>
<header><b>単語帳</b><div class="top"><span class="sub" id="sync"></span><button class="ico" id="themeBtn" data-a="theme"></button></div></header>
<main id="app"></main>
<nav><button data-a="tab" data-v="study">学習</button><button data-a="tab" data-v="words">単語帳</button><button data-a="tab" data-v="info">解説</button><button data-a="tab" data-v="prog">進捗</button></nav>
<script>
const K='tangocho-v1';
const uid=()=>Math.random().toString(36).slice(2,9);
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function seed(){
 const W=(no,en,ipa,ja,ety,ex)=>({id:uid(),no,en,ipa,ja,ety,ex,st:'new'});
 return {tab:'study',theme:matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light',ts:0,cur:'s2',sets:[{id:'s2',name:'Section 2',words:[
  W(1,'recognize','rékəgnaɪz','認識する・見分ける・認める','ラテン語 re-(再び)＋cognoscere(知る)。「再び知る」から、見覚えがある→それと分かる→正式に認める、へ広がりました。','I recognized her voice at once.\n彼女の声にすぐ気づいた。'),
  W(2,'achieve','ətʃíːv','達成する','古フランス語 a chief venir「頭(chief)に至る」。物事を最後まで到達させる意味になりました。','She achieved her goal.\n彼女は目標を達成した。'),
  W(3,'appreciate','əpríːʃieɪt','感謝する・真価を認める','ラテン語 ad-(〜へ)＋pretium(価値)。価値を認める→ありがたく思う。','I appreciate your help.\n手伝ってくれて感謝します。'),
  W(4,'consider','kənsídər','よく考える・〜とみなす','ラテン語 con-(共に)＋sidus(星)とされ、星を観察して見極める様子が由来といわれます。','Please consider my offer.\n私の申し出を考えてください。'),
  W(5,'encourage','enkə́ːrɪdʒ','励ます・促す','en-(与える)＋courage(勇気)。勇気を与える→励ます。','My teacher encouraged me to try.\n先生は私に挑戦するよう励ました。')]}]};
}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!S||!S.sets||!S.sets.length)S=seed();
let lastH=JSON.stringify(S.sets);
const save=()=>{const h=JSON.stringify(S.sets);if(h!==lastH){lastH=h;if(S.ts!==undefined)S.ts=Date.now();sched()}try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let Z=null,M='',conf=false;
const cs=()=>S.sets.find(s=>s.id===S.cur)||S.sets[0];
const all=()=>S.sets.flatMap(s=>s.words);
const byId=id=>all().find(w=>w.id===id);
const sorted=ws=>[...ws].sort((a,b)=>(a.no==null?1e9:a.no)-(b.no==null?1e9:b.no));
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const stTxt={new:'未学習',learning:'まだ',known:'覚えた'};
const setSel=()=>`<select data-c="setSel" aria-label="単語帳">${S.sets.map(s=>`<option value="${s.id}" ${s.id===cs().id?'selected':''}>${esc(s.name)}（${s.words.length}語）</option>`).join('')}</select>`;
const pool=()=>[...new Set(all().filter(w=>w.ja).map(w=>w.ja))];

function render(){
 document.documentElement.dataset.theme=S.theme;
 $('#themeBtn').textContent=S.theme==='dark'?'ライトモード':'ダークモード';
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.tab));
 $('#app').innerHTML=banner()+((Z&&S.tab==='study')?studyView():({study:setupView,words:wordsView,info:infoView,prog:progView})[S.tab]());
 if(Z&&S.tab==='study'&&Z.mode==='swipe'&&$('#card'))drag($('#card'));
}
function setupView(){
 const s=cs(),k=s.words.filter(w=>w.st==='known').length;
 return `<h2>学習する</h2>${setSel()}<div class="card pad" style="margin-top:12px"><p class="sub">${s.words.length}語中、覚えた単語は${k}語</p>
 <label class="sub"><input type="checkbox" id="incl" style="width:auto"> 覚えた単語も含める</label>
 <div class="row"><button class="btn pri" data-a="start" data-v="swipe">スワイプで学習</button><button class="btn" data-a="start" data-v="quiz">四択で学習</button></div>
 ${M?`<p class="msg">${M}</p>`:''}</div><p class="sub">番号を付けた単語は番号順に出題されます。「まだ」にした単語は、少し後でもう一度出ます。</p>`;
}
function studyView(){
 const done=Z.total-Z.q.length;
 const head=`<div class="top"><button class="ico" data-a="end" aria-label="終了">✕</button><div class="bar"><i class="k" style="width:${Z.known/Z.total*100}%"></i></div><b>${Z.known}/${Z.total}</b></div>`;
 if(!Z.q.length)return head+`<div class="card pad" style="margin-top:14px;text-align:center"><h2>学習完了</h2><p>${Z.known}語を覚えました。</p><button class="btn pri" data-a="end" style="width:100%">戻る</button></div>`;
 const w=byId(Z.q[0]);
 if(Z.mode==='swipe')return head+`<div class="card sw" id="card"><div class="sub">${w.no!=null?'No.'+w.no:''}</div><div class="word">${esc(w.en)}</div><div class="sub">${esc(w.ipa)}</div>${Z.flip?`<div class="ja">${esc(w.ja)}</div>`:'<div class="sub">タップで意味を表示</div>'}</div>
 <div class="row"><button class="btn ng" data-a="unk">← まだ</button><button class="btn" data-a="speak" data-v="${w.id}" style="flex:0">発音</button><button class="btn ok" data-a="know">覚えた →</button></div>
 <p class="sub" style="text-align:center">右にスワイプ＝覚えた / 左にスワイプ＝まだ（キーボードの矢印も使えます）</p>`;
 return head+`<div class="card pad" style="margin:14px 0;text-align:center"><div class="sub">${w.no!=null?'No.'+w.no:''}</div><div class="word">${esc(w.en)}</div><div class="sub">${esc(w.ipa)}</div></div>
 ${Z.ch.map((c,i)=>`<button class="opt ${Z.res?(c===w.ja?'ok':(i===Z.res.i?'ng':'')):''}" data-a="pick" data-v="${i}"><span>${esc(c)}</span>${Z.res?(c===w.ja?'<b class="mk ok">○</b>':(i===Z.res.i?'<b class="mk ng">✓</b>':'')):''}</button>`).join('')}
 ${Z.res?`<button class="btn pri" data-a="next" style="width:100%;margin-top:8px">次へ</button>`:''}`;
}
function wordsView(){
 const s=cs(),e=S.edit?byId(S.edit):null,v=k=>esc(e?(e[k]==null?'':e[k]):'');
 return `<h2>単語帳</h2>${setSel()}
 <div class="card pad" style="margin-top:12px"><div class="row"><input id="nn" placeholder="新しい単語帳の名前" style="flex:1"><button class="btn" data-a="newSet" style="flex:0">作成</button></div>
 <div class="row"><input id="rn" value="${esc(s.name)}" style="flex:1"><button class="btn" data-a="renSet" style="flex:0">名前を変更</button><button class="btn ng" data-a="delSet" style="flex:0">${conf?'本当に削除':'削除'}</button></div></div>
 <div class="card pad"><b>${e?'単語を編集':'単語を追加'}</b>
 <div class="row"><input id="f_no" type="number" placeholder="番号" value="${v('no')}" style="flex:1"><input id="f_en" placeholder="英単語" value="${v('en')}" style="flex:3"></div>
 <input id="f_ja" placeholder="意味（赤字の主な意味）" value="${v('ja')}"><input id="f_ja2" placeholder="その他の意味（解説に表示）" value="${v('ja2')}"><input id="f_pos" placeholder="品詞（例：形容詞）" value="${v('pos')}"><input id="f_ipa" placeholder="発音記号" value="${v('ipa')}">
 <textarea id="f_ety" placeholder="成り立ち・語源">${v('ety')}</textarea><textarea id="f_rel" placeholder="関連語・メモ">${v('rel')}</textarea><textarea id="f_ex" placeholder="例文（複数行可）">${v('ex')}</textarea>
 <div class="row"><button class="btn pri" data-a="saveWord">保存</button>${e?`<button class="btn" data-a="cancel">キャンセル</button>`:''}</div>${M?`<p class="msg">${M}</p>`:''}</div>
 <div class="card pad"><b>まとめて追加</b><p class="sub">1行に1語。「番号. 英単語 意味」の形で貼り付けると、番号順に並びます。</p>
 <textarea id="bulk" placeholder="1. recognize 認識する&#10;2. achieve 達成する"></textarea><button class="btn" data-a="bulk" style="width:100%">取り込む</button></div>
 <div class="card">${sorted(s.words).map(w=>`<div class="wrow" data-a="openInfo" data-v="${w.id}"><span class="no">${w.no==null?'–':w.no}</span><b>${esc(w.en)}</b><span>${esc(w.ja)}</span><i class="dot ${w.st}"></i></div>`).join('')||'<p class="sub" style="padding:16px">単語がありません。上のフォームから追加してください。</p>'}</div>`;
}
function infoView(){
 const s=cs(),ws=sorted(s.words);let w=byId(S.info);if(!w||!s.words.includes(w))w=ws[0];
 if(!w)return `<h2>解説</h2>${setSel()}<p class="sub">この単語帳には単語がありません。</p>`;
 return `<h2>解説</h2>${setSel()}<select data-c="infoSel" style="margin-bottom:12px">${ws.map(x=>`<option value="${x.id}" ${x.id===w.id?'selected':''}>${x.no!=null?x.no+'. ':''}${esc(x.en)}</option>`).join('')}</select>
 <div class="card pad"><div class="word" style="text-align:left;padding:0">${esc(w.en)}</div><div class="sub">${w.pos?`<span class="pos">${esc(posFull(w.pos))}</span> `:''}${esc(w.ipa)}　状態：${stTxt[w.st]}</div><div class="ja" style="text-align:left;padding:0">${esc(w.ja)}</div>
 ${w.ja2?`<h3>その他の意味</h3><p style="margin:0">${esc(w.ja2)}</p>`:''}<h3>成り立ち・語源</h3><p style="margin:0;white-space:pre-wrap">${esc(w.ety)||'<span class="sub">未入力です。編集から追加できます。</span>'}</p>
 ${w.rel?`<h3>関連語・メモ</h3>${relHtml(w.rel)}`:''}<h3>例文</h3>${w.ex?`<div class="ex">${esc(w.ex)}</div>`:'<span class="sub">未入力です。</span>'}
 <div class="row" style="margin-top:16px">${SAMPLE&&!w.ety?`<button class="btn" data-a="getEty" data-v="${w.id}">語源を取得</button>`:''}<button class="btn" data-a="speak" data-v="${w.id}">発音</button><button class="btn" data-a="editWord" data-v="${w.id}">編集</button><button class="btn ng" data-a="delWord" data-v="${w.id}">削除</button></div></div>`;
}
function progView(){
 const ws=all(),k=ws.filter(w=>w.st==='known').length,p=ws.length?Math.round(k/ws.length*100):0;
 return `<h2>進捗</h2><div class="card pad"><div class="pct">${p}%</div><p class="sub">全${ws.length}語のうち${k}語を覚えました</p></div>
 ${S.sets.map(s=>{const n=s.words.length||1,a=s.words.filter(w=>w.st==='known').length,l=s.words.filter(w=>w.st==='learning').length;
 return `<div class="card pad"><div class="top"><b style="flex:1">${esc(s.name)}</b><span class="sub">${a}/${s.words.length}語</span></div>
 <div class="bar" style="margin:8px 0"><i class="k" style="width:${a/n*100}%"></i><i class="l" style="width:${l/n*100}%"></i></div>
 <p class="sub">覚えた ${a}　まだ ${l}　未学習 ${s.words.length-a-l}</p><button class="btn" data-a="reset" data-v="${s.id}" style="width:100%">この単語帳の進捗をリセット</button></div>`}).join('')}${syncCard()}`;
}
function prep(){
 if(Z.mode!=='quiz'||!Z.q.length)return;
 const w=byId(Z.q[0]);Z.ch=shuf([w.ja,...shuf(pool().filter(x=>x!==w.ja)).slice(0,3)]);Z.res=null;
}
function answer(ok){
 const id=Z.q.shift(),w=byId(id);w.st=ok?'known':'learning';
 if(ok)Z.known++;else Z.q.splice(Math.min(3,Z.q.length),0,id);
 Z.flip=false;prep();save();render();
}
function drag(el){
 let x0=null,dx=0,mv=false;
 const fin=ok=>{el.style.transform=`translateX(${ok?600:-600}px)`;setTimeout(()=>answer(ok),180)};
 el.onpointerdown=e=>{x0=e.clientX;dx=0;mv=false;el.setPointerCapture(e.pointerId);el.style.transition='none'};
 el.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)mv=true;el.style.transform=`translateX(${dx}px) rotate(${dx/30}deg)`;el.dataset.d=dx>50?'r':dx<-50?'l':''};
 el.onpointerup=()=>{if(x0===null)return;x0=null;el.style.transition='transform .2s';
  if(dx>100)fin(true);else if(dx<-100)fin(false);else{el.style.transform='';el.dataset.d='';if(!mv){Z.flip=!Z.flip;render()}}};
}
function parse(t){
 return t.split(/\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
  const m=l.match(/^(\d+)[\s.．)）、:：]+(.*)$/),no=m?+m[1]:null,r=m?m[2]:l,i=r.search(/[^\x00-\x7F]/);
  const en=(i<0?r:r.slice(0,i)).replace(/[\s,，、:：\-–]+$/,'').trim(),ja=i<0?'':r.slice(i).trim();
  return en?{id:uid(),no,en,ja,ipa:'',ety:'',ex:'',st:'new'}:null}).filter(Boolean);
}
const g=id=>($('#'+id)||{}).value||'';
const A={
 tab:v=>{S.tab=v;M='';conf=false;S.edit=null},
 theme:()=>{S.theme=S.theme==='dark'?'light':'dark'},
 start:v=>{
  const incl=$('#incl')&&$('#incl').checked,q=sorted(cs().words).filter(w=>incl||w.st!=='known').map(w=>w.id);
  if(!q.length){M='出題できる単語がありません。';return}
  if(v==='quiz'&&pool().length<4){M='四択には、意味が入った単語が全体で4語以上必要です。';return}
  M='';Z={mode:v,q,total:q.length,known:0,flip:false,res:null};prep();
 },
 end:()=>{Z=null},
 know:()=>answer(true),unk:()=>answer(false),
 pick:v=>{if(Z.res)return;const w=byId(Z.q[0]);Z.res={i:+v,ok:Z.ch[+v]===w.ja}},
 next:()=>answer(Z.res.ok),
 speak:v=>{try{const u=new SpeechSynthesisUtterance(byId(v).en);u.lang='en-US';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}},
 newSet:()=>{const n=g('nn').trim();if(!n)return;const s={id:uid(),name:n,words:[]};S.sets.push(s);S.cur=s.id},
 renSet:()=>{const n=g('rn').trim();if(n)cs().name=n},
 delSet:()=>{if(!conf){conf=true;return}conf=false;if(S.sets.length<2){M='最後の単語帳は削除できません。';return}(S.skip=S.skip||[]).push(cs().id);S.sets=S.sets.filter(s=>s.id!==cs().id);S.cur=S.sets[0].id},
 saveWord:()=>{
  const en=g('f_en').trim();if(!en){M='英単語を入力してください。';return}M='';
  const no=g('f_no')===''?null:+g('f_no'),d={no,en,ja:g('f_ja').trim(),ja2:g('f_ja2').trim(),pos:g('f_pos').trim(),ipa:g('f_ipa').trim(),ety:g('f_ety').trim(),ex:g('f_ex').trim(),rel:g('f_rel').trim()};
  if(S.edit){Object.assign(byId(S.edit),d);S.edit=null}else{const nw={id:uid(),st:'new',...d};cs().words.push(nw);if(!nw.ety)setTimeout(()=>fillEty([nw.id]),0)}
 },
 cancel:()=>{S.edit=null;M=''},
 bulk:()=>{const ws=parse(g('bulk')),have=new Set(cs().words.map(w=>w.en.toLowerCase()));const add=ws.filter(w=>!have.has(w.en.toLowerCase()));cs().words.push(...add);setTimeout(()=>fillEty(add.map(w=>w.id)),0)},
 openInfo:v=>{S.info=v;S.tab='info'},
 editWord:v=>{S.edit=v;S.tab='words'},
 delWord:v=>{cs().words=cs().words.filter(w=>w.id!==v)},
 reset:v=>{S.sets.find(s=>s.id===v).words.forEach(w=>w.st='new')},

 if(m){full=full.slice(m[0].length)}
 const parts=full.split('；');let red=parts[0];const rest=parts.slice(1);
 const k=red.match(/^(.*?)(\((?:\u21d4|\u2252)[^]*)$/);
 if(k){red=k[1];rest.unshift(k[2])}
 return[red,(pos+rest.join('；')).trim()];
}
function mkWord(pid,r){const [ja,ja2]=splitJa(r[3]);return{id:pid+'-'+r[0],no:r[0],en:r[1],ipa:r[2],ja,ja2,rel:r[4],ety:ETY[r[0]]||'',pos:POSA[r[0]-474]||'',ex:r[5]+'\n'+r[6],st:'new'}}
PRESET.push({id:'p-kt',name:'英コミュテスト単語',w:[...PRESET[0].w,...PRESET[1].w]});
function ensurePreset(){
 if(st==='choose')return;
 let fixed=false;
 for(const s of S.sets){const p=PRESET.find(x=>x.id===s.id);if(!p)continue;for(const w of s.words){const r=p.w.find(x=>w.id===s.id+'-'+x[0]);if(!r)continue;if(w.ja2===undefined){[w.ja,w.ja2]=splitJa(r[3]);fixed=true}else if(/^〔/.test(w.ja2)){w.ja2=w.ja2.replace(/^〔[^〕]*〕/,'');fixed=true}if(!w.ety&&ETY[r[0]]){w.ety=ETY[r[0]];fixed=true}if(!w.pos&&POSA[r[0]-474]){w.pos=POSA[r[0]-474];fixed=true}}}
 S.skip=S.skip||[];let first=null;
 for(const p of PRESET){
  if(S.skip.includes(p.id)||S.sets.some(s=>s.id===p.id))continue;
  S.sets.push({id:p.id,name:p.name,words:p.w.map(r=>mkWord(p.id,r))});
  first=first||p.id;
 }
 if(first||fixed){if(first)S.cur=first;save();render()}
}
function sched(){clearTimeout(tm);tm=setTimeout(()=>{tm=null;push()},1500)}
function chunksOf(sets){const out=[];const meta=sets.map(s=>{const n=Math.max(1,Math.ceil(s.words.length/SZ));for(let i=0;i<n;i++)out.push([`c_${s.id}_${i}`,{words:s.words.slice(i*SZ,(i+1)*SZ)}]);return{id:s.id,name:s.name,n}});return{out,meta}}
async function push(){
 if(!col)return;if(running){again=true;return}
 running=true;
 try{
  setSt('syncing');if(S.ts===undefined)S.ts=Date.now();
  const {out,meta}=chunksOf(S.sets),ids=out.map(x=>x[0]);
  for(const [id,d] of out){const j=JSON.stringify(d);if(cache[id]!==j){await col.doc(id).set(d);cache[id]=j}}
  await col.doc('meta').set({ts:S.ts,sets:meta,chunks:ids});
  for(const id of remoteChunks)if(!ids.includes(id)){await col.doc(id).delete();delete cache[id]}
  remoteChunks=ids;save();setSt('ok');
 }catch(e){setSt('err')}
 finally{running=false;if(again){again=false;push()}}
}
async function pull(force){
 if(!col||running)return;
 try{
  setSt('syncing');
  const m=await col.doc('meta').get();
  if(!m.exists){if(S.ts===undefined)S.ts=Date.now();await push();return}
  const meta=m.data();remoteChunks=meta.chunks||[];
  if(!force){
   if(S.ts===undefined){setSt('choose');return}
   if(meta.ts<=S.ts){if(meta.ts<S.ts)await push();else setSt('ok');return}
  }
  const sets=[];
  for(const sm of meta.sets){const words=[];for(let i=0;i<sm.n;i++){const d=await col.doc(`c_${sm.id}_${i}`).get();if(d.exists)words.push(...d.data().words)}sets.push({id:sm.id,name:sm.name,words})}
  if(!sets.length)throw new Error('empty');
  try{localStorage.setItem(K+'-backup',JSON.stringify(S))}catch(e){}
  S.sets=sets;S.ts=meta.ts;if(!sets.some(s=>s.id===S.cur))S.cur=sets[0].id;S.edit=null;S.info=null;
  chunksOf(sets).out.forEach(([id,d])=>{cache[id]=JSON.stringify(d)});
  lastH=JSON.stringify(S.sets);save();setSt('ok');render();
 }catch(e){setSt('err')}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&col&&!Z&&!tm)pull()});
(async()=>{
 setSt('connecting');setTimeout(()=>{if(st==='connecting')setSt('off')},12000);
 try{
  if(!window.claude||!claude.use)return setSt('off');
  claude.use('sample').then(s=>{SAMPLE=s}).catch(()=>{});
  const db=await claude.use('db'),user=await claude.use('user'),id=user&&await user.id();
  if(!db||!id)return setSt('off');
  col=db.collection('data/users/'+id);await pull();
 }catch(e){setSt('off')}
})().then(ensurePreset);
render();
</script></body></html>
